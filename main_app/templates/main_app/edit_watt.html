{% extends 'layouts/base.html' %} {% load static %} {% load custom_filters %} {%block breadcrumbs %}{% endblock breadcrumbs %} {% block content %}
<div class="container-xxl flex-grow-1 container-p-y">
  <!-- Basic Layout & Basic with Icons -->
  <div class="row">
    <!-- Basic Layout -->
    <div class="col-xxl">
      <div class="card mb-6">
        <div
          class="card-header d-flex align-items-center justify-content-between"
        >
          <h4 class="mb-0">Edit Watt</h4>
        </div>
        <div class="card-body">
          <form action="{% url 'edit_watt' user_id %}" method="post">
            {% csrf_token %}

            <!-- Watt Field -->
            <div class="row mb-6">
              <label class="col-sm-2 col-form-label" for="Watt"><strong>Min Watt</strong></label>
              <div class="col-sm-3">
                <div class="input-group input-group-merge">
                  <span id="volt-icon" class="input-group-text">
                    <i class="bx bxs-bolt"></i>
                  </span>
                  <input
                    type="number"
                    class="form-control"
                    id="volt-icon"
                    name="current_value"
                    value = "{{current_watt}}"
                    placeholder="Set minimum watt"
                    autofocus
                  />
                </div>
              </div>
              
            </div>
            <div class="row mb-6">
              <label class="col-sm-2 col-form-label" for="Watt"><strong>Max Watt</strong></label>
              <div class="col-sm-3">
                <div class="input-group input-group-merge">
                  <span id="volt-icon" class="input-group-text">
                    <i class="bx bxs-bolt"></i>
                  </span>
                  <input
                    type="number"
                    class="form-control"
                    id="volt-icon"
                    name="max_watt"
                    value = "{{max_watt}}"
                    placeholder="Set maximum Watt"
                    autofocus
                  />
                </div>
              </div>
              
            </div>  
            <!-- Submit Button -->
            <div class="row justify-content-end">
              <div class="col-sm-10">
                <button type="submit" class="btn btn-primary sm ">
                  <i class="mdi mdi-pencil mdi-24px me-1 icon-animate-plus"></i
                  ><strong>Update Watt</strong>
                </button>

              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>










{% endblock content %}
